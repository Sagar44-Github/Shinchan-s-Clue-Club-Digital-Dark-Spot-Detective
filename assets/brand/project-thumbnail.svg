<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Shinchan's Clue Club — solve the mystery in the evidence</title>
  <desc id="desc">A comic-book yellow and blue detective clubhouse with Shinchan, a three-dimensional evidence desk, source folders, connected clue cards, and a case pinboard.</desc>
